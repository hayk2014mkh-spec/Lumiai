<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Իմ AI Օգնականը</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121214; color: #e1e1e6; display: flex; flex-direction: column; height: 100vh; }
    
    header { background: #1a1a1e; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #29292e; }
    header h1 { font-size: 18px; color: #04d361; }
    button.key-btn { background: #29292e; color: #fff; border: 1px solid #3e3e46; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    button.key-btn:hover { background: #3e3e46; }

    #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 15px; white-space: pre-wrap; word-break: break-word; }
    .user { align-self: flex-end; background-color: #04d361; color: #000; font-weight: 500; border-bottom-right-radius: 2px; }
    .ai { align-self: flex-start; background-color: #202024; color: #e1e1e6; border-bottom-left-radius: 2px; border: 1px solid #29292e; }

    footer { padding: 15px 20px; background: #1a1a1e; border-top: 1px solid #29292e; }
    .input-box { display: flex; gap: 10px; max-width: 900px; margin: 0 auto; }
    input[type="text"] { flex: 1; background: #121214; border: 1px solid #323238; color: #fff; padding: 12px 16px; border-radius: 8px; font-size: 15px; outline: none; }
    input[type="text"]:focus { border-color: #04d361; }
    button.send-btn { background: #04d361; color: #000; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button.send-btn:hover { background: #00b352; }
  </style>
</head>
<body>

  <header>
    <h1>🤖 Իմ AI Չատբոտ</h1>
    <button class="key-btn" onclick="promptApiKey()">🔑 Փոխել API Key-ը</button>
  </header>

  <div id="chat-container">
    <div class="message ai">Ողջույն։ Ես քո AI օգնականն եմ։ Ինչո՞վ կարող եմ օգնել։</div>
  </div>

  <footer>
    <form class="input-box" onsubmit="handleSend(event)">
      <input type="text" id="userInput" placeholder="Գրիր հարցդ այստեղ..." autocomplete="off" />
      <button type="submit" class="send-btn">Ուղարկել</button>
    </form>
  </footer>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('userInput');
    let history = [
      { role: "system", content: "You are a helpful, smart, and friendly AI assistant. Answer in the language the user speaks." }
    ];

    function getApiKey() {
      let key = localStorage.getItem('groq_api_key');
      if (!key) {
        key = prompt("Խնդրում ենք մուտքագրել քո անվճար Groq API Key-ը (կարող ես վերցնել console.groq.com կայքից)՝");
        if (key) localStorage.setItem('groq_api_key', key.trim());
      }
      return key;
    }

    function promptApiKey() {
      const key = prompt("Մուտքագրիր նոր Groq API Key-ը՝", localStorage.getItem('groq_api_key') || '');
      if (key !== null) {
        localStorage.setItem('groq_api_key', key.trim());
        alert("API Key-ը պահպանվեց:");
      }
    }

    function appendMessage(text, sender) {
      const msg = document.createElement('div');
      msg.className = `message ${sender}`;
      msg.innerText = text;
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function handleSend(e) {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      const apiKey = getApiKey();
      if (!apiKey) {
        alert("Առանց API Key-ի AI-ը չի կարող պատասխանել:");
        return;
      }

      appendMessage(text, 'user');
      userInput.value = '';
      history.push({ role: "user", content: text });

      // AI-ի պատասխանի սպասման նշան
      const loadingMsg = document.createElement('div');
      loadingMsg.className = 'message ai';
      loadingMsg.innerText = 'Մտածում է...';
      chatContainer.appendChild(loadingMsg);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      try {
        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${apiKey}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            messages: history,
            temperature: 0.7
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const aiResponse = data.choices[0].message.content;
        loadingMsg.innerText = aiResponse;
        history.push({ role: "assistant", content: aiResponse });
      } catch (err) {
        loadingMsg.innerText = "Սխալ՝ " + err.message;
        loadingMsg.style.color = "#ff6b6b";
      }
    }
  </script>
</body>
</html>

    header h1 { font-size: 18px; color: #04d361; }
    button.key-btn { background: #29292e; color: #fff; border: 1px solid #3e3e46; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    button.key-btn:hover { background: #3e3e46; }

    #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }

    .ai { align-self: flex-start; background-color: #202024; color: #e1e1e6; border-bottom-left-radius: 2px; border: 1px solid #29292e; }

    footer { padding: 15px 20px; background: #1a1a1e; border-top: 1px solid #29292e; }
    .input-box { display: flex; gap: 10px; max-width: 900px; margin: 0 auto; }
    input[type="text"] { flex: 1; background: #121214; border: 1px solid #323238; color: #fff; padding: 12px 16px; border-radius: 8px; font-size: 15px; outline: none; }
    input[type="text"]:focus { border-color: #04d361; }
    button.send-btn { background: #04d361; color: #000; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    button.send-btn:hover { background: #00b352; }
  </style>
</head>

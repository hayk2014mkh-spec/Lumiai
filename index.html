<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Հանրային AI Չատբոտ</title>
  <!-- Puter.js AI SDK (ապահովում է անվճար AI առանց API Key-ի) -->
  <script src="https://js.puter.com/v2/"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }

    header { background: #1e293b; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; }
    header h1 { font-size: 18px; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .status-badge { font-size: 12px; background: #059669; color: #fff; padding: 3px 8px; border-radius: 12px; }

    #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .message { max-width: 80%; padding: 12px 18px; border-radius: 16px; line-height: 1.5; font-size: 15px; word-break: break-word; white-space: pre-wrap; }
    .user { align-self: flex-end; background-color: #38bdf8; color: #0f172a; font-weight: 500; border-bottom-right-radius: 4px; }
    .ai { align-self: flex-start; background-color: #1e293b; color: #f1f5f9; border: 1px solid #334155; border-bottom-left-radius: 4px; }

    footer { padding: 16px; background: #1e293b; border-top: 1px solid #334155; }
    .input-box { display: flex; gap: 10px; max-width: 800px; margin: 0 auto; }
    input[type="text"] { flex: 1; background: #0f172a; border: 1px solid #475569; color: #fff; padding: 14px 18px; border-radius: 10px; font-size: 15px; outline: none; }
    input[type="text"]:focus { border-color: #38bdf8; }
    button.send-btn { background: #38bdf8; color: #0f172a; border: none; padding: 0 22px; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s; }
    button.send-btn:hover { background: #0ea5e9; }
    button.send-btn:disabled { background: #475569; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <h1>🤖 Ընդհանուր AI Օգնական</h1>
    <span class="status-badge">Ակտիվ է բոլորի համար</span>
  </header>

  <div id="chat-container">
    <div class="message ai">Ողջո՜ւյն: Կարող ես ինձ տալ ցանկացած հարց, ես պատրաստ եմ օգնել:</div>
  </div>

  <footer>
    <form class="input-box" onsubmit="handleSend(event)">
      <input type="text" id="userInput" placeholder="Գրիր հարցդ այստեղ..." autocomplete="off" />
      <button type="submit" id="sendBtn" class="send-btn">Ուղարկել</button>
    </form>
  </footer>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    function appendMessage(text, sender) {
      const msg = document.createElement('div');
      msg.className = `message ${sender}`;
      msg.innerText = text;
      chatContainer.appendChild(msg);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msg;
    }

    async function handleSend(e) {
      e.preventDefault();
      const text = userInput.value.trim();
      if (!text) return;

      // Օգտատիրոջ հաղորդագրությունը
      appendMessage(text, 'user');
      userInput.value = '';
      userInput.disabled = true;
      sendBtn.disabled = true;

      // AI-ի պատասխանի բլոկ
      const aiMsg = appendMessage("...", 'ai');

      try {
        // Կանչում ենք Puter.js AI-ը (հոսքային տարբերակով՝ տառ առ տառ)
        const response = await puter.ai.chat(text, { stream: true });
        aiMsg.innerText = "";

        for await (const part of response) {
          if (part?.text) {
            aiMsg.innerText += part.text;
            chatContainer.scrollTop = chatContainer.scrollHeight;
          }
        }
      } catch (err) {
        aiMsg.innerText = "Սխալ՝ " + (err.message || "Չհաջողվեց կապ հաստատել");
        aiMsg.style.color = "#f87171";
      } finally {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    }
  </script>
</body>
</html>
